name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Bootstrap the dev environment
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  typecheck:
    name: Type-check (strict mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Bootstrap the dev environment
        run: uv sync

      # Strictness lives in pyproject's [tool.mypy], so this is the same
      # command — and the same verdict — a contributor gets locally.
      - name: Type-check
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Bootstrap the dev environment
        run: uv sync --python ${{ matrix.python }}

      - name: Run the test suite
        run: uv run --python ${{ matrix.python }} pytest

  report-equality:
    # The third determinism layer (C9): the same lexicon and prompt must
    # serialize identically on every OS and Python. Each cell resolves the fixed
    # fixture set and compares it to the committed golden; a divergence fails the
    # cell, and the job name names the platform. fail-fast is off so one
    # platform's regression never hides another's.
    name: Report equality (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Bootstrap the dev environment
        run: uv sync --python ${{ matrix.python }}

      - name: Compare resolution against the cross-platform golden
        run: uv run --python ${{ matrix.python }} python scripts/report_equality.py --check

  performance:
    # The performance envelope (C11) as a build-failing gate: a single runner on
    # one fixed Python, so the number is comparable run to run. It asserts the
    # envelope × a stated headroom, so only a large regression trips it. A
    # second, non-gating step records the raw timings so a trend stays visible
    # even when the gate passes. Additive to the PR gate — no new trigger.
    name: Performance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Bootstrap the dev environment
        run: uv sync --python 3.12

      - name: Perf gate (envelope × headroom)
        run: uv run --python 3.12 pytest -m perf

      - name: Record raw timings (non-gating)
        continue-on-error: true
        run: uv run --python 3.12 python tests/perf/benchmark.py

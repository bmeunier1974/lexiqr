[project]
name = "lexiqr"
version = "0.0.1"
description = "Deterministic, tenant-scoped resolution of company jargon to canonical entities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Benoit Meunier" }]
keywords = ["nlp", "entity-resolution", "lexicon", "fuzzy-matching", "i18n"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["rapidfuzz>=3.0"]

[project.urls]
Homepage = "https://github.com/bmeunier1974/lexiqr"
Repository = "https://github.com/bmeunier1974/lexiqr"

[project.scripts]
lexiqr = "lexiqr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexiqr"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20260518",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "scripts"]

[project]
name = "lexiqr"
version = "1.0.0"
description = "Deterministic, tenant-scoped resolution of company jargon to canonical entities."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639: the license is an SPDX expression and the license file ships in the
# wheel's dist-info. The legacy `License ::` classifier is deliberately absent —
# it is deprecated alongside the expression, and stating the license twice is
# two places for it to disagree.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benoit Meunier" }]
keywords = ["nlp", "entity-resolution", "lexicon", "fuzzy-matching", "i18n"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = ["rapidfuzz>=3.0"]

[project.urls]
Homepage = "https://github.com/bmeunier1974/lexiqr"
Repository = "https://github.com/bmeunier1974/lexiqr"
Documentation = "https://github.com/bmeunier1974/lexiqr/tree/main/docs"
Issues = "https://github.com/bmeunier1974/lexiqr/issues"
Changelog = "https://github.com/bmeunier1974/lexiqr/blob/main/CHANGELOG.md"

[project.scripts]
lexiqr = "lexiqr.cli:main"

[build-system]
# hatchling ≥ 1.27 emits Metadata-Version 2.4, which is what carries the PEP 639
# `License-Expression` and `License-File` fields declared above.
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexiqr"]

# The versioned lexicon schema lives at the repo root (single source of truth,
# shared with the offline-authoring workflow), but it must also ship inside the
# wheel so an integrating developer has the lexicon format alongside the code.
# force-include maps that one file into the package; the fixtures and the
# publication record stay out — they are dev/CI artifacts, not runtime contract.
[tool.hatch.build.targets.wheel.force-include]
"schema/lexicon.v1.schema.json" = "lexiqr/schema/lexicon.v1.schema.json"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.1",
    "mypy>=1.11",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20260518",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260724",
    "hypothesis>=6.164.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The performance gate is deselected from the default run — timing it in the
# ordinary Python matrix would be noisy and slow. The dedicated perf CI job
# selects it with `-m perf`, which overrides this default.
addopts = ["-m", "not perf"]
markers = [
    "perf: the CI performance gate (C11); excluded from the default run, run with -m perf",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
# The sample run is named file-by-file rather than as a directory: `examples/` is
# a corpus of lexicon documents that happens to hold one Python file, not a
# type-checked tree. It is here because the test suite imports it — a strictly
# checked test cannot import an unchecked module — and because a reader is
# invited to copy code out of it, which should agree with the type hints the
# package advertises.
files = ["src", "tests", "scripts", "examples/demo.py"]
